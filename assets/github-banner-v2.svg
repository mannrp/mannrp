<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mann - Full-Stack Software Engineer | Backend-Leaning</title>
  <desc id="desc">Transparent GitHub profile banner with a dark animated commit stream panel.</desc>
  <defs>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F5413" stop-opacity="0.4"/>
      <stop offset="0.42" stop-color="#F5E6A2"/>
      <stop offset="0.66" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#6F5413" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="streamFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.13" stop-color="white" stop-opacity="1"/>
      <stop offset="0.86" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="820" y="0" width="360" height="360" rx="18"/>
    </clipPath>
    <mask id="streamMask">
      <rect x="820" y="0" width="360" height="360" fill="url(#streamFade)"/>
    </mask>
    <filter id="textLift" x="-8%" y="-25%" width="116%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#textLift)">
    <text x="72" y="150" fill="#F8FAFC" stroke="#0B0B0C" stroke-width="1.1" paint-order="stroke fill" font-size="76" font-weight="760" letter-spacing="0">Mann</text>
    <text x="76" y="194" fill="#F1E3A4" stroke="#0B0B0C" stroke-width="0.65" paint-order="stroke fill" font-size="23" font-weight="520">Full-Stack Software Engineer | Backend-Leaning</text>
    <path d="M76 222 H448" stroke="url(#goldLine)" stroke-width="1.2" stroke-linecap="round"/>
  </g>

