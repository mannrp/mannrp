<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mann - Backend gravity. Full-stack range.</title>
  <desc id="desc">A transparent GitHub profile banner with a restrained gold technical mark representing backend gravity and full-stack range.</desc>
  <defs>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6A16"/>
      <stop offset="0.28" stop-color="#F5E6A2"/>
      <stop offset="0.52" stop-color="#B88A1B"/>
      <stop offset="0.74" stop-color="#FFF2B8"/>
      <stop offset="1" stop-color="#7A5A12"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5A12" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#F5E6A2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8A6A16" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="coreFill" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F4E6B0"/>
      <stop offset="1" stop-color="#B88A1B"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="textLift" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g transform="translate(72 42)">
    <rect x="0.75" y="0.75" width="1058.5" height="174.5" rx="24" fill="transparent" stroke="url(#goldStroke)" stroke-width="1.5"/>
    <rect x="8.5" y="8.5" width="1043" height="159" rx="19" fill="transparent" stroke="#D6C27A" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M38 140 H334" stroke="url(#goldSoft)" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#textLift)">
    <text x="108" y="116" fill="#F8FAFC" stroke="#0B0B0C" stroke-width="1.2" paint-order="stroke fill" font-size="66" font-weight="760" letter-spacing="0">Mann</text>
    <text x="112" y="156" fill="#F1E3A4" stroke="#0B0B0C" stroke-width="0.7" paint-order="stroke fill" font-size="22" font-weight="520">Backend gravity. Full-stack range.</text>
  </g>

  <g transform="translate(900 45)" filter="url(#softShadow)">
    <circle cx="70" cy="70" r="56" stroke="#9CA3AF" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="70" cy="70" r="35" stroke="#C9A227" stroke-opacity="0.16" stroke-width="1"/>

    <line x1="70" y1="70" x2="70" y2="18" stroke="#8B949E" stroke-opacity="0.58" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="118" y2="42" stroke="#8B949E" stroke-opacity="0.58" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="118" y2="98" stroke="#8B949E" stroke-opacity="0.58" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="70" y2="124" stroke="#8B949E" stroke-opacity="0.58" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="22" y2="98" stroke="#8B949E" stroke-opacity="0.58" stroke-width="1.25" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="22" y2="42" stroke="#8B949E" stroke-opacity="0.58" stroke-width="1.25" stroke-linecap="round"/>

    <circle cx="70" cy="70" r="12" fill="url(#coreFill)" stroke="#FFF2B8" stroke-width="1.3"/>
    <circle cx="70" cy="70" r="19" stroke="#C9A227" stroke-opacity="0.35" stroke-width="1"/>

    <circle cx="70" cy="18" r="5.5" fill="transparent" stroke="#D1D5DB" stroke-width="1.4"/>
    <circle cx="118" cy="42" r="5.5" fill="transparent" stroke="#D1D5DB" stroke-width="1.4"/>
    <circle cx="118" cy="98" r="5.5" fill="transparent" stroke="#D1D5DB" stroke-width="1.4"/>
    <circle cx="70" cy="124" r="5.5" fill="transparent" stroke="#D1D5DB" stroke-width="1.4"/>
    <circle cx="22" cy="98" r="5.5" fill="#C9A227" fill-opacity="0.9" stroke="#FFF2B8" stroke-width="1"/>
    <circle cx="22" cy="42" r="5.5" fill="transparent" stroke="#D1D5DB" stroke-width="1.4"/>
  </g>
</svg>
