<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MANNRP - Full-stack systems, applied AI, product UX</title>
  <desc id="desc">A dark technical banner with a subtle grid, system nodes, and profile positioning text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#243041" stroke-width="1" opacity="0.42"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.21 0 0 0 0 0.75 0 0 0 0 0.65 0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.55"/>
  <rect x="28" y="28" width="1144" height="304" rx="18" stroke="#334155" stroke-width="1.5"/>

  <path d="M790 95 C850 70 895 93 932 132 C970 174 1026 164 1076 130" stroke="#38BDF8" stroke-width="2" opacity="0.55"/>
  <path d="M781 228 C840 190 890 214 930 247 C970 280 1024 263 1080 222" stroke="#34D399" stroke-width="2" opacity="0.5"/>
  <path d="M840 161 L922 161 L1000 214 L1084 214" stroke="#94A3B8" stroke-width="1.5" opacity="0.45"/>

  <g filter="url(#softGlow)">
    <circle cx="790" cy="95" r="6" fill="#38BDF8"/>
    <circle cx="932" cy="132" r="6" fill="#38BDF8"/>
    <circle cx="1076" cy="130" r="6" fill="#38BDF8"/>
    <circle cx="781" cy="228" r="6" fill="#34D399"/>
    <circle cx="930" cy="247" r="6" fill="#34D399"/>
    <circle cx="1080" cy="222" r="6" fill="#34D399"/>
  </g>

  <g opacity="0.92">
    <rect x="804" y="145" width="88" height="32" rx="8" fill="#111827" stroke="#334155"/>
    <rect x="913" y="145" width="96" height="32" rx="8" fill="#111827" stroke="#334155"/>
    <rect x="1032" y="198" width="94" height="32" rx="8" fill="#111827" stroke="#334155"/>
    <text x="848" y="166" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">MODEL</text>
    <text x="961" y="166" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">API</text>
    <text x="1079" y="219" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">PRODUCT</text>
  </g>

  <text x="80" y="128" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="0">MANNRP</text>
  <text x="84" y="172" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">Full-stack systems | Applied AI | Product UX</text>
  <text x="84" y="216" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Building useful software from messy workflows.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#CBD5E1">
    <rect x="84" y="254" width="98" height="32" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="133" y="275" text-anchor="middle">Systems</text>
    <rect x="194" y="254" width="92" height="32" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="240" y="275" text-anchor="middle">AI tools</text>
    <rect x="298" y="254" width="106" height="32" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="351" y="275" text-anchor="middle">Workflows</text>
  </g>
</svg>
