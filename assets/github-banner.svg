<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mann - Software engineer building full-stack systems, applied AI tools, and product workflows</title>
  <desc id="desc">A dark GitHub profile banner with a compact product systems map.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#080B10"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.65"/>
  <rect x="28" y="28" width="1144" height="304" rx="18" fill="#0B0F14" stroke="#263241" stroke-width="1.5"/>

  <g opacity="0.9">
    <path d="M760 174 L850 110 L974 126 L1056 206 L930 252 L812 230 Z" stroke="#334155" stroke-width="1.5"/>
    <path d="M850 110 L930 252" stroke="#334155" stroke-width="1.2"/>
    <path d="M974 126 L812 230" stroke="#334155" stroke-width="1.2"/>
    <path d="M760 174 L1056 206" stroke="#334155" stroke-width="1.2"/>
  </g>

  <g filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#D1D5DB">
    <rect x="720" y="151" width="80" height="46" rx="10" fill="#111827" stroke="#3B4658"/>
    <text x="760" y="179" text-anchor="middle">UX</text>

    <rect x="810" y="87" width="80" height="46" rx="10" fill="#10151D" stroke="#3B4658"/>
    <text x="850" y="115" text-anchor="middle">AUTH</text>

    <rect x="934" y="103" width="80" height="46" rx="10" fill="#10151D" stroke="#3B4658"/>
    <text x="974" y="131" text-anchor="middle">DATA</text>

    <rect x="1016" y="183" width="80" height="46" rx="10" fill="#111827" stroke="#3B4658"/>
    <text x="1056" y="211" text-anchor="middle">AI</text>

    <rect x="890" y="229" width="80" height="46" rx="10" fill="#10151D" stroke="#3B4658"/>
    <text x="930" y="257" text-anchor="middle">API</text>

    <rect x="772" y="207" width="80" height="46" rx="10" fill="#10151D" stroke="#3B4658"/>
    <text x="812" y="235" text-anchor="middle">SHIP</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="80" y="132" fill="#F8FAFC" font-size="72" font-weight="760" letter-spacing="0">Mann</text>
    <text x="84" y="178" fill="#D1D5DB" font-size="22" font-weight="500">Full-stack systems, applied AI tools, and product workflows.</text>
    <text x="84" y="222" fill="#9CA3AF" font-size="18">Turning messy workflows into useful software.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="84" y="278" fill="#6B7280">portfolio</text>
    <text x="158" y="278" fill="#E5E7EB">mannrp.dev</text>
    <text x="284" y="278" fill="#374151">/</text>
    <text x="308" y="278" fill="#6B7280">linkedin</text>
    <text x="382" y="278" fill="#E5E7EB">linkedin.com/in/mannrp</text>
  </g>
